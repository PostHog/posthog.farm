name: Rebuild the farm

# Rebuilds every day so new PostHog hedgehogs move in and departed ones move out.
# The roster is fetched at build time (scripts/fetch-hedgehogs.ts, via `npm run build`).
# Hedgehog XP lives in the Durable Object, so redeploying never resets the farm.

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch today's hedgehogs
        run: npm run fetch:hedgehogs
      - run: npm run typecheck
      - name: Build
        run: npx vite build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
