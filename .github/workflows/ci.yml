name: CI

# Checks only. Deploys happen in Cloudflare Workers Builds on every push to main,
# and the Worker's own cron triggers a daily rebuild (see README).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch today's hedgehogs
        run: npm run fetch:hedgehogs
      - run: npm run typecheck
      - name: Build
        run: npx vite build
